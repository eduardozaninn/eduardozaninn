<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-labelledby="t d">
  <title id="t">Resultados</title>
  <desc id="d">Redução de 40 por cento no tempo de resposta do suporte, 2 anos no desenvolvimento de sistemas públicos e 6 sistemas e portais entregues</desc>
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121a36"/>
      <stop offset="1" stop-color="#0d1326"/>
    </linearGradient>
  </defs>
  <style>
    .sans{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    @keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @keyframes rg{from{stroke-dasharray:0 100}to{stroke-dasharray:40 100}}
    @keyframes sx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
    .fu{animation:fu .8s cubic-bezier(.2,.7,.2,1) both}
    .rg{stroke-dasharray:40 100;animation:rg 1.6s ease .5s both}
    .seg{transform-box:fill-box;transform-origin:0 50%;animation:sx 1s ease both}
    .dt{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
  </style>

  <!-- card 1 -->
  <g class="fu" style="animation-delay:.1s">
    <rect x="30" y="20" width="300" height="180" rx="16" fill="url(#card)" stroke="#1e293b"/>
    <rect x="50" y="20" width="260" height="3" rx="1.5" fill="url(#acc)" fill-opacity=".8"/>
    <circle cx="105" cy="110" r="42" fill="none" stroke="#1e293b" stroke-width="10"/>
    <circle class="rg" cx="105" cy="110" r="42" fill="none" stroke="url(#acc)" stroke-width="10" stroke-linecap="round" pathLength="100" transform="rotate(-90 105 110)"/>
    <text class="sans" x="105" y="118" font-size="24" font-weight="800" fill="#f8fafc" text-anchor="middle">-40%</text>
    <text class="sans" x="170" y="100" font-size="16" font-weight="600" fill="#e2e8f0">tempo de resposta</text>
    <text class="sans" x="170" y="122" font-size="16" font-weight="600" fill="#e2e8f0">do suporte</text>
    <text class="mono" x="170" y="150" font-size="12" fill="#22d3ee">Maringá Conectada</text>
  </g>

  <!-- card 2 -->
  <g class="fu" style="animation-delay:.3s">
    <rect x="350" y="20" width="300" height="180" rx="16" fill="url(#card)" stroke="#1e293b"/>
    <rect x="370" y="20" width="260" height="3" rx="1.5" fill="url(#acc)" fill-opacity=".8"/>
    <text class="sans" x="378" y="88" font-size="46" font-weight="800" fill="url(#acc)">2 anos</text>
    <text class="sans" x="378" y="118" font-size="15" fill="#cbd5e1">no desenvolvimento de</text>
    <text class="sans" x="378" y="138" font-size="15" fill="#cbd5e1">sistemas públicos</text>
    <rect x="378" y="162" width="112" height="8" rx="4" fill="#1e293b"/>
    <rect x="498" y="162" width="112" height="8" rx="4" fill="#1e293b"/>
    <rect class="seg" x="378" y="162" width="112" height="8" rx="4" fill="url(#acc)" style="animation-delay:.9s"/>
    <rect class="seg" x="498" y="162" width="112" height="8" rx="4" fill="url(#acc)" style="animation-delay:1.5s"/>
  </g>

  <!-- card 3 -->
  <g class="fu" style="animation-delay:.5s">
    <rect x="670" y="20" width="300" height="180" rx="16" fill="url(#card)" stroke="#1e293b"/>
    <rect x="690" y="20" width="260" height="3" rx="1.5" fill="url(#acc)" fill-opacity=".8"/>
    <text class="sans" x="698" y="88" font-size="46" font-weight="800" fill="url(#acc)">6</text>
    <text class="sans" x="698" y="118" font-size="15" fill="#cbd5e1">sistemas e portais</text>
    <text class="sans" x="698" y="138" font-size="15" fill="#cbd5e1">entregues</text>
    <circle class="dt" cx="704" cy="166" r="6" fill="url(#acc)" style="animation-delay:1.1s"/>
    <circle class="dt" cx="728" cy="166" r="6" fill="url(#acc)" style="animation-delay:1.25s"/>
    <circle class="dt" cx="752" cy="166" r="6" fill="url(#acc)" style="animation-delay:1.4s"/>
    <circle class="dt" cx="776" cy="166" r="6" fill="url(#acc)" style="animation-delay:1.55s"/>
    <circle class="dt" cx="800" cy="166" r="6" fill="url(#acc)" style="animation-delay:1.7s"/>
    <circle class="dt" cx="824" cy="166" r="6" fill="url(#acc)" style="animation-delay:1.85s"/>
  </g>
</svg>
