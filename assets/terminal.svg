<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350" role="img" aria-labelledby="t d">
  <title id="t">Terminal</title>
  <desc id="d">Eduardo Zanin, formado em ADS e SEO técnico na liveSEO, com stack em Python, JavaScript, React, Next.js e SQL</desc>
  <style>
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    .cover{fill:#0d1326}
    @keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes a1{to{transform:translateX(120px)}}
    @keyframes a2{to{transform:translateX(640px)}}
    @keyframes a3{to{transform:translateX(200px)}}
    @keyframes a4{to{transform:translateX(520px)}}
    @keyframes a5{to{transform:translateX(260px)}}
    @keyframes a6{to{transform:translateX(710px)}}
    @keyframes sh{from{opacity:0}to{opacity:1}}
    .c1{animation:a1 .8s steps(8) .4s forwards}
    .c2{animation:a2 2s steps(55) 1.4s forwards}
    .c3{animation:a3 1.1s steps(15) 3.7s forwards}
    .c4{animation:a4 1.6s steps(44) 5.1s forwards}
    .c5{animation:a5 1.2s steps(21) 7s forwards}
    .c6{animation:a6 2.2s steps(63) 8.5s forwards}
    .last{animation:sh .1s linear 10.9s both}
    .cur{animation:bl 1s steps(1) 10.9s infinite}
  </style>
  <defs>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect x="10" y="10" width="980" height="330" rx="16" fill="#0d1326" stroke="#1e293b"/>
  <path d="M10 26a16 16 0 0 1 16-16h948a16 16 0 0 1 16 16v26H10z" fill="#111a33"/>
  <circle cx="38" cy="31" r="6" fill="#ff5f57"/>
  <circle cx="58" cy="31" r="6" fill="#febc2e"/>
  <circle cx="78" cy="31" r="6" fill="#28c840"/>
  <text class="mono" x="500" y="36" font-size="13" fill="#64748b" text-anchor="middle">eduardo@portfolio: ~</text>
  <rect x="10" y="51" width="980" height="2" fill="url(#hl)" fill-opacity=".55"/>

  <g class="mono" font-size="18">
    <text x="60" y="96"><tspan fill="#34d399">$</tspan> <tspan fill="#e2e8f0">whoami</tspan></text>
    <rect class="cover c1" x="56" y="76" width="130" height="28"/>

    <text x="60" y="128" fill="#e2e8f0">eduardo.zanin <tspan fill="#475569">|</tspan> <tspan fill="#67e8f9">formado em ADS</tspan> <tspan fill="#475569">|</tspan> <tspan fill="#a78bfa">SEO técnico na liveSEO</tspan></text>
    <rect class="cover c2" x="56" y="108" width="660" height="28"/>

    <text x="60" y="176"><tspan fill="#34d399">$</tspan> <tspan fill="#e2e8f0">cat stack.txt</tspan></text>
    <rect class="cover c3" x="56" y="156" width="210" height="28"/>

    <text x="60" y="208" fill="#e2e8f0" xml:space="preserve"><tspan fill="#facc15">python</tspan>  <tspan fill="#fde047">javascript</tspan>  <tspan fill="#7dd3fc">react</tspan>  <tspan fill="#e2e8f0">next.js</tspan>  <tspan fill="#93c5fd">sql</tspan>  <tspan fill="#fb923c">git</tspan></text>
    <rect class="cover c4" x="56" y="188" width="540" height="28"/>

    <text x="60" y="256"><tspan fill="#34d399">$</tspan> <tspan fill="#e2e8f0">cat o_que_busco.txt</tspan></text>
    <rect class="cover c5" x="56" y="236" width="270" height="28"/>

    <text x="60" y="288" fill="#e2e8f0">desenvolvimento em <tspan fill="#facc15">Python</tspan> e <tspan fill="#7dd3fc">React</tspan>, ou <tspan fill="#a78bfa">SEO técnico</tspan> com automação</text>
    <rect class="cover c6" x="56" y="268" width="730" height="28"/>

    <g class="last"><text x="60" y="326"><tspan fill="#34d399">$</tspan></text></g>
    <rect class="cur" x="82" y="311" width="11" height="19" fill="#e2e8f0"/>
  </g>
</svg>
