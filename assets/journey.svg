<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 1000 230" width="1000" height="230" role="img" aria-labelledby="t d">
  <title id="t">Trajetória</title>
  <desc id="d">De repositor em 2021 a consultor técnico de SEO e formado em ADS em 2026</desc>
  <defs>
    <linearGradient id="acc" gradientUnits="userSpaceOnUse" x1="70" y1="0" x2="930" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <style>
    .sans{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    @keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes dr{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
    @keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
    @keyframes pr{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
    .fu{animation:fu .8s cubic-bezier(.2,.7,.2,1) both}
    .line{stroke-dasharray:1;animation:dr 2.6s ease .2s both}
    .nd{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
    .ring{transform-box:fill-box;transform-origin:center;animation:pr 2.2s ease-out 3.4s infinite}
  </style>

  <rect x="10" y="50" width="980" height="200" rx="16" fill="#0d1326" stroke="#1e293b"/>
  <path class="line" pathLength="1" d="M70 130H930" fill="none" stroke="url(#acc)" stroke-width="3" stroke-linecap="round"/>

  <!-- 2021 -->
  <g>
    <text class="mono fu" x="130" y="98" font-size="15" fill="#67e8f9" text-anchor="middle" style="animation-delay:.6s">2021</text>
    <circle class="nd" cx="130" cy="130" r="9" fill="#0a0f1f" stroke="#22d3ee" stroke-width="3" style="animation-delay:.6s"/>
    <g class="fu" style="animation-delay:.8s">
      <text class="sans" x="130" y="170" font-size="16" font-weight="700" fill="#f1f5f9" text-anchor="middle">Repositor</text>
      <text class="sans" x="130" y="192" font-size="13" fill="#94a3b8" text-anchor="middle">Supermercados Bom Dia</text>
      <text class="sans" x="130" y="212" font-size="13" fill="#67e8f9" text-anchor="middle">atendimento ao público</text>
    </g>
  </g>

  <!-- 2023 -->
  <g>
    <text class="mono fu" x="370" y="98" font-size="15" fill="#67e8f9" text-anchor="middle" style="animation-delay:1.1s">2023</text>
    <circle class="nd" cx="370" cy="130" r="9" fill="#0a0f1f" stroke="#38bdf8" stroke-width="3" style="animation-delay:1.1s"/>
    <g class="fu" style="animation-delay:1.3s">
      <text class="sans" x="370" y="170" font-size="16" font-weight="700" fill="#f1f5f9" text-anchor="middle">Jovem Aprendiz</text>
      <text class="sans" x="370" y="192" font-size="13" fill="#94a3b8" text-anchor="middle">Agropecuária Frigo Gil</text>
      <text class="sans" x="370" y="212" font-size="13" fill="#7dd3fc" text-anchor="middle">atendimento e organização</text>
    </g>
  </g>

  <!-- 2024 -->
  <g>
    <text class="mono fu" x="610" y="98" font-size="15" fill="#c4b5fd" text-anchor="middle" style="animation-delay:1.7s">2024</text>
    <circle class="nd" cx="610" cy="130" r="9" fill="#0a0f1f" stroke="#a78bfa" stroke-width="3" style="animation-delay:1.7s"/>
    <g class="fu" style="animation-delay:1.9s">
      <text class="sans" x="610" y="170" font-size="16" font-weight="700" fill="#f1f5f9" text-anchor="middle">Estágio em desenvolvimento</text>
      <text class="sans" x="610" y="192" font-size="13" fill="#94a3b8" text-anchor="middle">Prefeitura de Maringá (AmTech)</text>
      <text class="sans" x="610" y="212" font-size="13" fill="#c4b5fd" text-anchor="middle">React, Next.js e Python</text>
    </g>
  </g>

  <!-- 2026 -->
  <g>
    <text class="mono fu" x="850" y="98" font-size="15" fill="#6ee7b7" text-anchor="middle" style="animation-delay:2.4s">2026</text>
    <circle class="ring" cx="850" cy="130" r="11" fill="none" stroke="#34d399" stroke-width="2"/>
    <circle class="nd" cx="850" cy="130" r="12" fill="#34d399" stroke="#a7f3d0" stroke-width="3" style="animation-delay:2.4s"/>
    <g class="fu" style="animation-delay:2.6s">
      <text class="sans" x="850" y="170" font-size="16" font-weight="700" fill="#f1f5f9" text-anchor="middle">Consultor Técnico de SEO</text>
      <text class="sans" x="850" y="192" font-size="13" fill="#94a3b8" text-anchor="middle">Agência liveSEO</text>
      <text class="sans" x="850" y="212" font-size="13" fill="#6ee7b7" text-anchor="middle">e formado em ADS</text>
    </g>
  </g>
</svg>
